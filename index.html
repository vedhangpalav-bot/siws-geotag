<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>College Geo-Tag Camera</title>
<script src="piexif.js"></script>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#1b2333;--mu:#5d6779;--ac:#1f3864;--bd:#d5dbe6;--ok:#1b7f3b;--warn:#b26a00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161f;--card:#1b212d;--tx:#e8ecf3;--mu:#98a3b6;--ac:#7fa6ff;--bd:#2c3546;--ok:#5fd07f;--warn:#f0b04a}}
:root[data-theme="dark"]{--bg:#12161f;--card:#1b212d;--tx:#e8ecf3;--mu:#98a3b6;--ac:#7fa6ff;--bd:#2c3546;--ok:#5fd07f;--warn:#f0b04a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:.2em 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.st{font-size:.92rem}.ok{color:var(--ok)}.warn{color:var(--warn)}
.note{font-size:.82rem;color:var(--mu)}
button{width:100%;background:var(--ac);color:#fff;border:0;border-radius:10px;padding:14px;font:inherit;font-size:1.05rem;cursor:pointer;margin-top:8px}
:root[data-theme="dark"] button,:root:not([data-theme="light"]) button{color:#0b1220}
button.sec{background:transparent;color:var(--ac);border:1px solid var(--ac)}
button:disabled{opacity:.5}
canvas{width:100%;height:auto;border-radius:10px;display:block;margin-top:10px}
.shot{overflow:hidden}
</style></head><body><div class="wrap">
<h1>College Geo-Tag Camera</h1>
<div class="card">
<div class="st" id="gps">Getting GPS location…</div>
<div class="note" id="where"></div>
<button id="snap" disabled>Take Photo</button>
<input id="cam" type="file" accept="image/*" capture="environment" hidden>
<p class="note">The stamp uses your phone's live GPS and current date/time at the moment you take the photo. Allow location access when asked.</p>
</div>
<div id="out"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const CFG={name:"Mumbai, Maharashtra, India",lat:19.021999,lng:72.858379,radius:500,
 addr:["Plot No 337, Major R. Parameshwaran Road,","Sewree Wadala Estate, Wadala,","Mumbai, Maharashtra 400031, India"],
 college:"S.I.W.S. College (Autonomous), Wadala"};
let pos=null,shots=[];
const pad=n=>String(n).padStart(2,'0');
function dist(a,b,c,d){const R=6371000,t=x=>x*Math.PI/180,dl=t(c-a),dn=t(d-b);
 const h=Math.sin(dl/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function tzLabel(d){const o=-d.getTimezoneOffset(),s=o>=0?'+':'-',a=Math.abs(o);return `GMT ${s}${pad(Math.floor(a/60))}:${pad(a%60)}`;}
function fmtDate(d){let h=d.getHours();const ap=h>=12?'PM':'AM';h=h%12||12;
 return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(h)}:${pad(d.getMinutes())} ${ap} ${tzLabel(d)}`;}
function startGps(){
 if(!navigator.geolocation){$('gps').textContent='GPS not supported on this device.';$('gps').className='st warn';return;}
 navigator.geolocation.watchPosition(p=>{pos=p;const c=p.coords,dd=dist(c.latitude,c.longitude,CFG.lat,CFG.lng);
  $('gps').textContent=`GPS ready (±${Math.round(c.accuracy)} m)`;$('gps').className='st ok';
  $('where').textContent=dd<=CFG.radius?`You are at the college campus (${Math.round(dd)} m from centre).`:`You are ${(dd/1000).toFixed(1)} km from the college. The stamp will show your actual coordinates.`;
  $('snap').disabled=false;},
  e=>{$('gps').textContent='Location unavailable: '+(e.code===1?'permission denied. Enable location for this page.':e.message);$('gps').className='st warn';$('snap').disabled=true;},
  {enableHighAccuracy:true,maximumAge:5000,timeout:20000});}
function wrap(ctx,t,w){const ws=t.split(' '),o=[];let l='';for(const x of ws){const q=l?l+' '+x:x;if(ctx.measureText(q).width>w&&l){o.push(l);l=x}else l=q}if(l)o.push(l);return o;}
function stamp(img,c,when,fix){
 const r=Math.min(1,2400/Math.max(img.width,img.height));const W=Math.round(img.width*r),H=Math.round(img.height*r);
 c.width=W;c.height=H;const x=c.getContext('2d');x.drawImage(img,0,0,W,H);
 const s=Math.min(W,H*1.333)/1600,m=Math.max(24*s,W*.03),fs=28*s,lh=36*s,maxW=W-2*m;
 const la=fix.latitude,lo=fix.longitude,onCampus=dist(la,lo,CFG.lat,CFG.lng)<=CFG.radius;
 x.font=`400 ${fs}px Roboto,Arial,sans-serif`;
 const lines=[];
 if(onCampus)CFG.addr.forEach(l=>lines.push(...wrap(x,l,maxW)));
 lines.push(`Lat ${la.toFixed(6)}° Long ${lo.toFixed(6)}° (±${Math.round(fix.accuracy)} m)`);
 lines.push(fmtDate(when));
 lines.push('Captured live with GPS');
 const title=onCampus?CFG.name:'Current location';
 const total=lines.length+1,bh=total*lh+20*s,by=H-m*.6-bh;
 const g=x.createLinearGradient(0,by-40*s,0,H);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.25,'rgba(0,0,0,.45)');g.addColorStop(1,'rgba(0,0,0,.6)');
 x.fillStyle=g;x.fillRect(0,by-40*s,W,H-(by-40*s));
 x.fillStyle='#fff';x.textBaseline='top';x.font=`700 ${34*s}px Roboto,Arial,sans-serif`;
 let y=by;x.fillText(title,m,y);y+=lh+4*s;x.font=`400 ${fs}px Roboto,Arial,sans-serif`;
 lines.forEach((l,i)=>{if(i===lines.length-1){x.font=`400 ${22*s}px Roboto,Arial,sans-serif`;x.fillStyle='rgba(255,255,255,.8)'}x.fillText(l,m,y);y+=lh;});
 x.font=`700 ${30*s}px Roboto,Arial,sans-serif`;x.fillStyle='rgba(255,255,255,.95)';x.textAlign='right';
 x.fillText(onCampus?CFG.college:'Geo-Tag Stamp',W-m,by-28*s);x.textAlign='left';
}
function dms(v){v=Math.abs(v);const d=Math.floor(v),m=Math.floor((v-d)*60),s=Math.round(((v-d)*60-m)*60*10000);return[[d,1],[m,1],[s,10000]]}
function toBlob(c,when,fix){return new Promise(res=>c.toBlob(async b=>{
 try{const u=await new Promise((r,j)=>{const f=new FileReader();f.onload=()=>r(f.result);f.onerror=j;f.readAsDataURL(b)});
  const la=fix.latitude,lo=fix.longitude,e={"0th":{},"Exif":{},"GPS":{}};
  e["0th"][piexif.ImageIFD.Software]="College Geo-Tag Camera";
  e.Exif[piexif.ExifIFD.DateTimeOriginal]=`${when.getFullYear()}:${pad(when.getMonth()+1)}:${pad(when.getDate())} ${pad(when.getHours())}:${pad(when.getMinutes())}:${pad(when.getSeconds())}`;
  e.GPS[piexif.GPSIFD.GPSVersionID]=[2,3,0,0];
  e.GPS[piexif.GPSIFD.GPSLatitudeRef]=la>=0?'N':'S';e.GPS[piexif.GPSIFD.GPSLatitude]=dms(la);
  e.GPS[piexif.GPSIFD.GPSLongitudeRef]=lo>=0?'E':'W';e.GPS[piexif.GPSIFD.GPSLongitude]=dms(lo);
  res(await (await fetch(piexif.insert(piexif.dump(e),u))).blob());
 }catch(err){res(b)}},'image/jpeg',.92));}
$('snap').onclick=()=>{ // refresh fix at tap time, then open camera
 $('cam').click();};
$('cam').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
 const when=new Date(),fix=pos?{latitude:pos.coords.latitude,longitude:pos.coords.longitude,accuracy:pos.coords.accuracy}:null;
 if(!fix){alert('No GPS fix yet. Please wait for GPS to be ready.');return;}
 const url=URL.createObjectURL(f),img=new Image();
 img.onload=async()=>{
  const box=document.createElement('div');box.className='card shot';
  const c=document.createElement('canvas');stamp(img,c,when,fix);
  const save=document.createElement('button');save.textContent='Save / Share photo';
  const name=`geotag_${when.getFullYear()}${pad(when.getMonth()+1)}${pad(when.getDate())}_${pad(when.getHours())}${pad(when.getMinutes())}${pad(when.getSeconds())}.jpg`;
  save.onclick=async()=>{const b=await toBlob(c,when,fix),file=new File([b],name,{type:'image/jpeg'});
   const C=window.Capacitor,P=C&&C.Plugins;
   if(C&&C.isNativePlatform&&C.isNativePlatform()&&P&&P.Filesystem&&P.Share){
    try{const d=await new Promise((r,j)=>{const f=new FileReader();f.onload=()=>r(f.result.split(',')[1]);f.onerror=j;f.readAsDataURL(b)});
     const w=await P.Filesystem.writeFile({path:name,data:d,directory:'CACHE'});
     await P.Share.share({title:name,files:[w.uri]});return;
    }catch(x){if(!/cancel/i.test(String(x&&x.message)))alert('Save failed: '+(x&&x.message||x));return;}}
   if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file]});return}catch(x){if(x.name==='AbortError')return}}
   const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();};
  box.append(c,save);$('out').prepend(box);URL.revokeObjectURL(url);};
 img.src=url;};
startGps();
</script></body></html>
